services:
  # SvelteKit app (Node server via adapter-node)
  app:
    build:
      context: ./sveltekit-app
    container_name: cleaning-tasks-app
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${MONGO_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      TZ: ${TZ}
      ORIGIN: ${ORIGIN}
      PORT: ${PORT}
    networks:
      - app-network
    # Not published to the host - only the caddy reverse proxy talks to it.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Reverse proxy - terminates TLS (automatic HTTPS via Let's Encrypt for a
  # real DOMAIN) and forwards everything to the app container.
  caddy:
    image: caddy:2-alpine
    container_name: cleaning-tasks-proxy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    ports:
      - "80:80"
      - "443:443"

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# Network for containers to communicate
networks:
  app-network:
    driver: bridge
