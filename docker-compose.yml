services:
  # MongoDB Database - Port 27017
  mongodb:
    image: mongo:7.0
    container_name: cleaning-tasks-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
      # Run initialization script on first startup
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - app-network
    ports:
      - "27017:27017"

  # Mongo Express - Web UI for MongoDB
  # Access at http://localhost:8081
  mongo-express:
    image: mongo-express:latest
    container_name: cleaning-tasks-admin
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - app-network
    ports:
      - "8081:8081"
volumes:
  mongodb_data:
    driver: local

# Network for containers to communicate
networks:
  app-network:
    driver: bridge
